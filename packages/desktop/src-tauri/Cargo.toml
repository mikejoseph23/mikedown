[package]
name = "mikedown-desktop"
version = "0.1.0"
description = "MikeDown Desktop: a WYSIWYG markdown editor"
authors = ["Mike Joseph"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name
# (both default to the package name, which Windows build tooling rejects).
name = "mikedown_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 core. Window and menu APIs are part of the core crate (no plugin).
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# There is no `tauri-plugin-trash` on crates.io; the `trash` crate is what a
# delete command (M3) calls to move files to the OS Trash / Recycle Bin.
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
