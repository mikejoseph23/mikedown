[package]
name = "mikedown-desktop"
version = "0.3.0"
description = "MikeDown Desktop: a WYSIWYG markdown editor"
authors = ["Mike Joseph"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name
# (both default to the package name, which Windows build tooling rejects).
name = "mikedown_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 core. Window and menu APIs are part of the core crate (no plugin).
# `protocol-asset`: images next to a document render through `convertFileSrc`
# (asset://), scoped by `app.security.assetProtocol` in tauri.conf.json.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Keeps runtime scope grants (files and folders the user picked or launched
# with, often outside $HOME) across restarts so session restore and hot-exit
# backups can reopen them.
tauri-plugin-persisted-scope = "2"
# Update-found notification when no MikeDown window is focused (U2).
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# There is no `tauri-plugin-trash` on crates.io; the `trash` crate is what the
# tree's delete command calls to move files to the OS Trash / Recycle Bin.
trash = "5"
# Per-directory watcher for the folder tree, native with a polling fallback.
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hot-exit backups are keyed by the sha256 of the document path (M4).
sha2 = "0.10"
# AI inference engines (commands/ai.rs): streaming HTTP to the user's own
# endpoints (oMLX, LM Studio, Ollama, Anthropic, OpenAI...). rustls, no
# system OpenSSL; `stream` for the SSE bodies.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
# Cooperative cancellation of in-flight completions (watch channel + select!).
tokio = { version = "1", features = ["sync", "macros", "time"] }
# Total memory and the CPU brand for the AI setup wizard's local hint
# (commands/ai/hardware.rs). Only the `system` part.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Engine API keys live in the OS keychain (service net.iadev.mikedown, account
# = engine id); they never reach the webview or settings.json. Each OS gets its
# native store; any other target falls back to the crate's in-memory mock.
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies.keyring]
version = "3"

# macOS title-bar state Tauri does not wrap: NSWindow.documentEdited (dirty
# dot) and representedFilename (proxy icon). Same crates Tauri itself uses.
[target.'cfg(target_os = "macos")'.dependencies]
# The Dock menu (`dock.rs`) adds `applicationDockMenu:` to tao's app delegate.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSEvent", "NSApplication", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

# Pre-install code-signing check on the downloaded Windows installer
# (WinVerifyTrust + signer subject). Same major version the updater plugin uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }
# Taskbar jump list "New Window" task and the process AppUserModelID (`dock.rs`).
# Same major version Tauri already pulls in.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }

# Extended attributes (Finder tags, "Open With", quarantine) survive saves,
# copies and cross-volume moves.
[target.'cfg(unix)'.dependencies]
xattr = "1"
# `access(2)` for a folder's write permission (edge 10).
libc = "0.2"

[dev-dependencies]
# `tests/updater_staging.rs` drives the updater plugin on Tauri's mock runtime.
tauri = { version = "2", features = ["protocol-asset", "test"] }
# `commands/ai/tests.rs` runs the provider adapters against a loopback HTTP server.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
