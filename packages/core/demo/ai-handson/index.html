<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI hands-on harness</title>
  <link rel="stylesheet" href="../../dist/styles.css">
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #f5f5f5; }
    .bar { display: flex; gap: 8px; padding: 8px 12px; background: #333; color: #fff; align-items: center; flex-wrap: wrap; }
    .bar button { font: inherit; }
    #editor { height: calc(100vh - 48px); background: #fff; }
  </style>
</head>
<body>
  <div class="bar">
    <strong>AI hands-on (real oMLX)</strong>
    <button id="ai-off" type="button">AI off</button>
    <button id="ai-noroute" type="button">AI on, no route</button>
    <button id="ai-on" type="button">AI on (routed)</button>
    <span id="status"></span>
  </div>
  <div id="editor"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
